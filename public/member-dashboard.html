<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="FitHub – Member Dashboard" />
  <title>FitHub – My Dashboard</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    :root {
      --bg-primary:    #09090b;
      --bg-secondary:  #121214;
      --bg-tertiary:   #1a1a1e;
      --card-bg:       rgba(20, 20, 24, 0.85);
      --card-border:   rgba(255, 255, 255, 0.06);
      --text-main:     #f4f4f5;
      --text-muted:    #a1a1aa;
      --accent:        #f97316;
      --accent-dim:    rgba(249, 115, 22, 0.15);
      --accent-hover:  #fb923c;
      --color-purple:  #a855f7;
      --color-cyan:    #06b6d4;
      --color-green:   #10b981;
      --color-red:     #ef4444;
      --font-heading: 'Outfit', sans-serif;
      --font-body:    'Inter', sans-serif;
      --radius-lg:    16px;
      --radius-md:    10px;
      --radius-sm:    6px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-body);
      background: var(--bg-primary);
      color: var(--text-main);
      min-height: 100vh;
    }

    /* ── Top Nav ── */
    .topnav {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 32px;
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--card-border);
      position: sticky; top: 0; z-index: 100;
    }
    .topnav-brand {
      display: flex; align-items: center; gap: 10px;
      font-family: var(--font-heading); font-size: 1.35rem; font-weight: 700;
      color: var(--accent);
    }
    .topnav-brand i { font-size: 1.5rem; }
    .topnav-user {
      display: flex; align-items: center; gap: 12px;
      font-size: 0.9rem; color: var(--text-muted);
    }
    .topnav-user strong { color: var(--text-main); }
    .btn-logout {
      background: rgba(239,68,68,0.12); border: 1px solid rgba(239,68,68,0.25);
      color: #fb7185; padding: 7px 14px; border-radius: var(--radius-sm);
      cursor: pointer; font-size: 0.8rem; font-weight: 600;
      transition: all 0.2s;
    }
    .btn-logout:hover { background: rgba(239,68,68,0.25); }

    /* ── Main Layout ── */
    .dashboard { max-width: 1100px; margin: 0 auto; padding: 32px 24px; }

    .welcome-banner {
      background: linear-gradient(135deg, rgba(249,115,22,0.12), rgba(168,85,247,0.08));
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      padding: 28px 32px;
      margin-bottom: 28px;
    }
    .welcome-banner h1 {
      font-family: var(--font-heading); font-size: 1.6rem; font-weight: 700;
      margin-bottom: 6px;
    }
    .welcome-banner p { color: var(--text-muted); font-size: 0.95rem; }

    /* ── Cards Grid ── */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 18px;
      margin-bottom: 28px;
    }
    .stat-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      padding: 22px 24px;
      backdrop-filter: blur(12px);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .stat-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    }
    .stat-card .label {
      font-size: 0.78rem; color: var(--text-muted);
      text-transform: uppercase; letter-spacing: 0.5px;
      margin-bottom: 8px;
    }
    .stat-card .value {
      font-family: var(--font-heading); font-size: 1.5rem; font-weight: 700;
    }
    .stat-card .icon {
      float: right; font-size: 1.4rem; opacity: 0.6;
    }
    .stat-card .icon.orange { color: var(--accent); }
    .stat-card .icon.cyan   { color: var(--color-cyan); }
    .stat-card .icon.green  { color: var(--color-green); }
    .stat-card .icon.purple { color: var(--color-purple); }

    /* ── Section ── */
    .section {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      padding: 24px;
      margin-bottom: 24px;
      backdrop-filter: blur(12px);
    }
    .section h2 {
      font-family: var(--font-heading); font-size: 1.15rem; font-weight: 700;
      margin-bottom: 18px; display: flex; align-items: center; gap: 8px;
    }
    .section h2 i { color: var(--accent); font-size: 1rem; }

    /* ── Table ── */
    .data-table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
    .data-table th {
      text-align: left; padding: 10px 12px; color: var(--text-muted);
      border-bottom: 1px solid var(--card-border); font-weight: 600;
      text-transform: uppercase; font-size: 0.72rem; letter-spacing: 0.5px;
    }
    .data-table td {
      padding: 10px 12px; border-bottom: 1px solid rgba(255,255,255,0.03);
    }
    .data-table tr:last-child td { border-bottom: none; }
    .data-table tr:hover td { background: rgba(255,255,255,0.02); }

    .badge {
      display: inline-block; padding: 3px 10px; border-radius: 20px;
      font-size: 0.72rem; font-weight: 600;
    }
    .badge.paid { background: rgba(16,185,129,0.15); color: #34d399; }
    .badge.unpaid { background: rgba(239,68,68,0.15); color: #fb7185; }
    .badge.active { background: rgba(16,185,129,0.15); color: #34d399; }

    /* ── Weekly Plan ── */
    .week-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
    }
    .day-card {
      background: var(--bg-tertiary);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-md);
      padding: 14px;
      text-align: center;
      transition: transform 0.2s;
    }
    .day-card:hover { transform: translateY(-2px); }
    .day-card.today {
      border-color: var(--accent);
      background: rgba(249,115,22,0.08);
    }
    .day-card .day-name {
      font-family: var(--font-heading); font-weight: 700;
      font-size: 0.85rem; margin-bottom: 6px;
    }
    .day-card .day-exercise {
      font-size: 0.78rem; color: var(--text-muted);
      line-height: 1.4;
    }
    .day-card.today .day-name { color: var(--accent); }

    .empty-state {
      text-align: center; padding: 40px; color: var(--text-muted);
    }
    .empty-state i { font-size: 2.5rem; margin-bottom: 12px; display: block; opacity: 0.4; }

    /* ── Loading ── */
    .loading {
      text-align: center; padding: 60px;
      color: var(--text-muted); font-size: 0.9rem;
    }
    .loading i { font-size: 2rem; margin-bottom: 10px; display: block; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 640px) {
      .topnav { padding: 12px 16px; }
      .dashboard { padding: 16px 12px; }
      .welcome-banner { padding: 20px; }
      .welcome-banner h1 { font-size: 1.25rem; }
    }
  </style>
</head>
<body>

  <!-- Top Navigation -->
  <nav class="topnav">
    <div class="topnav-brand">
      <i class="fa-solid fa-dumbbell"></i> FitHub
    </div>
    <div class="topnav-user">
      <span>Member: <strong id="user-name">—</strong></span>
      <button class="btn-logout" id="btn-change-password" style="background: rgba(255,255,255,0.1); margin-right: 10px;">
        <i class="fa-solid fa-key"></i> Change Password
      </button>
      <button class="btn-logout" id="btn-logout">
        <i class="fa-solid fa-right-from-bracket"></i> Logout
      </button>
    </div>
  </nav>

  <!-- Change Password Modal -->
  <div id="pw-modal" class="modal" style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); z-index: 1000; align-items: center; justify-content: center;">
    <div class="modal-content" style="background: var(--bg-secondary); padding: 24px; border-radius: var(--radius-md); border: 1px solid var(--card-border); width: 100%; max-width: 400px; position: relative;">
      <button id="close-pw-modal" style="position: absolute; top: 12px; right: 16px; background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 1.2rem;"><i class="fa-solid fa-xmark"></i></button>
      <h2 style="font-family: var(--font-heading); font-size: 1.2rem; margin-bottom: 16px;">Change Password</h2>
      <div id="pw-error" style="color: #ef4444; font-size: 0.85rem; margin-bottom: 12px; display: none;"></div>
      <div id="pw-success" style="color: #10b981; font-size: 0.85rem; margin-bottom: 12px; display: none;"></div>
      <form id="pw-form">
        <div style="margin-bottom: 12px;">
          <label style="display: block; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 4px;">Current Password</label>
          <input type="password" id="current-pw" required style="width: 100%; background: var(--bg-tertiary); border: 1px solid var(--card-border); color: var(--text-primary); padding: 10px 14px; border-radius: var(--radius-sm);">
        </div>
        <div style="margin-bottom: 20px;">
          <label style="display: block; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 4px;">New Password</label>
          <input type="password" id="new-pw" required style="width: 100%; background: var(--bg-tertiary); border: 1px solid var(--card-border); color: var(--text-primary); padding: 10px 14px; border-radius: var(--radius-sm);">
        </div>
        <button type="submit" style="width: 100%; padding: 10px; background: var(--accent); color: white; border: none; border-radius: var(--radius-sm); font-weight: 600; cursor: pointer;">Update Password</button>
      </form>
    </div>
  </div>

  <!-- Dashboard Content -->
  <div class="dashboard" id="dashboard">
    <div class="loading" id="loading">
      <i class="fa-solid fa-spinner"></i>
      Loading your dashboard…
    </div>
  </div>

  <script>
    // ── Auth guard ──
    const user = JSON.parse(localStorage.getItem('fithub_user') || 'null');
    if (!user || user.role !== 'member') {
      window.location.href = 'login.html';
    }

    document.getElementById('user-name').textContent = user ? user.name : '—';

    // Logout
    document.getElementById('btn-logout').addEventListener('click', () => {
      localStorage.removeItem('fithub_user');
      window.location.href = 'login.html';
    });

    // ── Change Password Logic ──
    const pwModal = document.getElementById('pw-modal');
    document.getElementById('btn-change-password').addEventListener('click', () => {
      pwModal.style.display = 'flex';
      document.getElementById('pw-error').style.display = 'none';
      document.getElementById('pw-success').style.display = 'none';
      document.getElementById('pw-form').reset();
    });
    document.getElementById('close-pw-modal').addEventListener('click', () => {
      pwModal.style.display = 'none';
    });
    
    document.getElementById('pw-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const currentPassword = document.getElementById('current-pw').value;
      const newPassword = document.getElementById('new-pw').value;
      
      try {
        const resp = await fetch('/api/me/password', {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'x-user-email': user.email,
            'x-user-role': user.role
          },
          body: JSON.stringify({ currentPassword, newPassword })
        });
        
        const data = await resp.json();
        if (resp.ok) {
          document.getElementById('pw-success').textContent = data.message;
          document.getElementById('pw-success').style.display = 'block';
          document.getElementById('pw-error').style.display = 'none';
          document.getElementById('pw-form').reset();
          setTimeout(() => { pwModal.style.display = 'none'; }, 2000);
        } else {
          throw new Error(data.error || 'Failed to update password');
        }
      } catch (err) {
        document.getElementById('pw-error').textContent = err.message;
        document.getElementById('pw-error').style.display = 'block';
        document.getElementById('pw-success').style.display = 'none';
      }
    });

    // ── Weekly exercise plan (based on plan type) ──
    function getWeeklyPlan(planName) {
      const plans = {
        'Basic Gym Access': [
          { day: 'Mon', exercise: 'Full Body\nCompound Lifts' },
          { day: 'Tue', exercise: 'Cardio\n30 min Run' },
          { day: 'Wed', exercise: 'Upper Body\nPush Focus' },
          { day: 'Thu', exercise: 'Rest Day\nLight Stretch' },
          { day: 'Fri', exercise: 'Lower Body\nSquats & Lunges' },
          { day: 'Sat', exercise: 'Core & Abs\nPlanks + HIIT' },
          { day: 'Sun', exercise: 'Rest Day\nRecovery' }
        ],
        'Elite Fitness Pro': [
          { day: 'Mon', exercise: 'Chest & Triceps\nBench + Dips' },
          { day: 'Tue', exercise: 'Back & Biceps\nRows + Curls' },
          { day: 'Wed', exercise: 'HIIT Class\n45 min Session' },
          { day: 'Thu', exercise: 'Legs & Glutes\nSqt + Deadlift' },
          { day: 'Fri', exercise: 'Shoulders\nOHP + Laterals' },
          { day: 'Sat', exercise: 'Group Class\nKickboxing' },
          { day: 'Sun', exercise: 'Active Rest\nYoga Flow' }
        ],
        'VIP Unlimited VIP': [
          { day: 'Mon', exercise: 'PT Session\nCustom Program' },
          { day: 'Tue', exercise: 'Athletic HIIT\nSprint Intervals' },
          { day: 'Wed', exercise: 'Strength\nOlympic Lifts' },
          { day: 'Thu', exercise: 'VIP Yoga\nMobility + Flow' },
          { day: 'Fri', exercise: 'Functional\nCrossTraining' },
          { day: 'Sat', exercise: 'Boxing Class\nVIP Only' },
          { day: 'Sun', exercise: 'Recovery\nSauna + Stretch' }
        ]
      };
      return plans[planName] || plans['Basic Gym Access'];
    }

    // ── Load member data ──
    async function loadDashboard() {
      try {
        const resp = await fetch('/api/me/member', {
          headers: { 'x-user-email': user.email }
        });

        if (!resp.ok) throw new Error('Failed to load data');
        const data = await resp.json();
        const p = data.profile;

        const todayIdx = new Date().getDay(); // 0=Sun
        const dayMap = [6, 0, 1, 2, 3, 4, 5]; // Sun→6, Mon→0, Tue→1 …
        const todayPlanIdx = dayMap[todayIdx];

        const weekPlan = getWeeklyPlan(p.planName);

        document.getElementById('dashboard').innerHTML = `
          <!-- Welcome -->
          <div class="welcome-banner">
            <h1>Welcome back, ${p.name} 👋</h1>
            <p>${p.planName} · Trainer: ${p.trainerName}</p>
          </div>

          <!-- Quick Stats -->
          <div class="cards-grid">
            <div class="stat-card">
              <i class="fa-solid fa-calendar-check icon orange"></i>
              <div class="label">Total Check-ins</div>
              <div class="value">${data.attendance.length}</div>
            </div>
            <div class="stat-card">
              <i class="fa-solid fa-credit-card icon purple"></i>
              <div class="label">Total Payments</div>
              <div class="value">$${data.payments.reduce((s, p) => s + p.amount, 0).toFixed(0)}</div>
            </div>
            <div class="stat-card">
              <i class="fa-solid fa-star icon cyan"></i>
              <div class="label">Current Plan</div>
              <div class="value" style="font-size:1.1rem">${p.planName}</div>
            </div>
            <div class="stat-card">
              <i class="fa-solid fa-user-shield icon green"></i>
              <div class="label">My Trainer</div>
              <div class="value" style="font-size:1.1rem">${p.trainerName}</div>
            </div>
          </div>

          <!-- Weekly Exercise Plan -->
          <div class="section">
            <h2><i class="fa-solid fa-dumbbell"></i> This Week's Plan</h2>
            <div class="week-grid">
              ${weekPlan.map((d, i) => `
                <div class="day-card ${i === todayPlanIdx ? 'today' : ''}">
                  <div class="day-name">${d.day}${i === todayPlanIdx ? ' (Today)' : ''}</div>
                  <div class="day-exercise">${d.exercise.replace('\n', '<br>')}</div>
                </div>
              `).join('')}
            </div>
          </div>

          <!-- Recent Attendance -->
          <div class="section">
            <h2><i class="fa-solid fa-clock-rotate-left"></i> Recent Attendance</h2>
            ${data.attendance.length > 0 ? `
              <table class="data-table">
                <thead><tr><th>Date</th><th>Time</th><th>Type</th></tr></thead>
                <tbody>
                  ${data.attendance.slice(0, 10).map(a => `
                    <tr>
                      <td>${a.date}</td>
                      <td>${a.time}</td>
                      <td>${a.checkInType}</td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            ` : '<div class="empty-state"><i class="fa-solid fa-calendar-xmark"></i>No attendance records yet</div>'}
          </div>

          <!-- Payment History -->
          <div class="section">
            <h2><i class="fa-solid fa-receipt"></i> Payment History</h2>
            ${data.payments.length > 0 ? `
              <table class="data-table">
                <thead><tr><th>Date</th><th>Plan</th><th>Amount</th><th>Method</th><th>Status</th></tr></thead>
                <tbody>
                  ${data.payments.map(pay => `
                    <tr>
                      <td>${pay.date}</td>
                      <td>${pay.planName}</td>
                      <td>$${pay.amount.toFixed(2)}</td>
                      <td>${pay.paymentMethod}</td>
                      <td><span class="badge ${pay.status.toLowerCase()}">${pay.status}</span></td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            ` : '<div class="empty-state"><i class="fa-solid fa-file-invoice-dollar"></i>No payment records yet</div>'}
          </div>
        `;
      } catch (err) {
        document.getElementById('dashboard').innerHTML = `
          <div class="empty-state">
            <i class="fa-solid fa-triangle-exclamation"></i>
            <p>Failed to load dashboard. Please try again.</p>
            <p style="font-size:0.8rem; margin-top:8px; opacity:0.6">${err.message}</p>
          </div>
        `;
      }
    }

    loadDashboard();
  </script>
</body>
</html>
